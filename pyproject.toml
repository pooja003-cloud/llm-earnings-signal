[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnsig"
version = "0.1.0"
description = "Does LLM-scored tone in earnings releases predict stock returns?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "pyarrow>=14",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "yfinance>=0.2.40",
  "anthropic>=0.75",
  "pysentiment2>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
earnsig = "earnsig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
